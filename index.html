/* ============ 前端防禦機制（於 React 掛載前執行） ============ */
(function () {
  /* --- Domain Lock --- */
  var ALLOWED = ['lolopodcast.github.io', 'localhost', '127.0.0.1'];
  var REDIRECT = 'https://www.ibs.ncnu.edu.tw/index.php/faculty/tenured-professor/299-smlo';
  var host = location.hostname;
  var ok = (host === '' || host === 'null') ? true : ALLOWED.some(function (d) {
    return host === d || host.endsWith('.' + d);
  });
  if (!ok) {
    document.body.innerHTML = DOMPurify.sanitize('<div style="text-align:center;padding:60px;font-family:sans-serif"><h1>Access Denied</h1><p>This resource is not authorised on this domain.</p></div>');
    setTimeout(function () { location.href = REDIRECT; }, 3000);
    return;
  }
  /* --- Iframe Busting --- */
  if (window.self !== window.top) {
    try { window.top.location.href = window.self.location.href; }
    catch (e) {
      document.body.innerHTML = DOMPurify.sanitize('<div style="text-align:center;padding:60px;font-family:sans-serif"><h1>Frame Blocked</h1><p>This content cannot be embedded.</p></div>');
    }
  }
})();

/* ============ 版權提示 Toast ============ */
var COPYRIGHT_MSG = 'Intellectual Property of Prof. Shihmin Lo';
var _cwToastTimer = null;
function showCopyrightToast(msg) {
  var el = document.getElementById('cw-toast');
  if (!el) return;
  el.innerHTML = DOMPurify.sanitize('&copy; ' + (msg || COPYRIGHT_MSG));
  el.classList.add('show');
  if (_cwToastTimer) clearTimeout(_cwToastTimer);
  _cwToastTimer = setTimeout(function () { el.classList.remove('show'); }, 2000);
}
window.showCopyrightToast = showCopyrightToast;

/* ============ 智慧型右鍵與快捷鍵攔截 ============ */
document.addEventListener('contextmenu', function (e) {
  var selection = (window.getSelection() ? window.getSelection().toString() : '').trim();
  var tag = e.target && e.target.tagName ? e.target.tagName.toUpperCase() : '';
  var isForm = (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT');
  if (isForm) return true;
  if (selection.length > 0) return true;   /* 有反白 → 允許（查字典 / 複製筆記） */
  e.preventDefault();
  showCopyrightToast();
});

document.addEventListener('keydown', function (e) {
  var k = (e.key || '').toLowerCase();
  if (e.key === 'F12') { e.preventDefault(); showCopyrightToast(); return; }
  if (e.ctrlKey && !e.shiftKey && k === 'u') { e.preventDefault(); showCopyrightToast(); return; }
  if (e.ctrlKey && e.shiftKey && ['i', 'j', 'c'].indexOf(k) !== -1) { e.preventDefault(); showCopyrightToast(); return; }
  /* Ctrl+P（列印）與 Ctrl+S（存檔）刻意開放，確保學生可離線複習 */
});

document.addEventListener('dragstart', function (e) {
  var tag = e.target && e.target.tagName ? e.target.tagName.toUpperCase() : '';
  if (tag === 'IMG' || (e.target.closest && e.target.closest('svg'))) e.preventDefault();
});

/* ============ Service Worker 註冊（PWA） ============ */
/* 只在真正的部署網域註冊；本機 127.0.0.1／localhost 也算安全來源，方便測試。 */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    var host = location.hostname;
    var okHost = (host === 'lolopodcast.github.io' || host === 'localhost' || host === '127.0.0.1');
    if (!okHost) return;
    navigator.serviceWorker.register('sw.js').then(function (reg) {
      /* 有新版時立刻換掉，不讓學生停在舊快取 */
      reg.addEventListener('updatefound', function () {
        var nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', function () {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) nw.postMessage('skipWaiting');
        });
      });
    }).catch(function () { /* 註冊失敗不影響網頁本身 */ });
  });
  var _reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (_reloaded) return; _reloaded = true; location.reload();
  });
}

/* ============ DOMPurify 安全包裝（動態 HTML 插入用） ============ */
window.safeHTML = function (raw) {
  try { return DOMPurify.sanitize(String(raw)); }
  catch (err) { return ''; }
};

function Gate({ onPass, lang, setLang, isDark }) {

                  className="w-full bg-white/10 border border-[#D8C3A5]/40 rounded-xl pl-4 pr-12 py-3 text-white placeholder-white/40
                    focus:outline-none focus:border-[#D8C3A5] focus:ring-2 focus:ring-[#D8C3A5]/30" />

/* 呼叫端自帶底色時，就不要再串上預設底色。
   Tailwind 的 bg-white 與 bg-[#004030] 具體性相同，誰贏由產生出來的 CSS 順序決定——
   實測 bg-white 會贏，於是深綠卡在淺色模式變成白底白字，整段看不見。
   淺色與深色分開判斷：className 只給了 dark:bg-* 時，淺色的預設仍要留著。
   (^|\s) 這個邊界讓 bg- 不會誤抓到 dark:bg-。 */
const Card = ({ children, className = '', innerRef }) => {
  const base = [
    /(^|\s)bg-/.test(className) ? '' : 'bg-white',
    /(^|\s)dark:bg-/.test(className) ? '' : 'dark:bg-slate-800/60'
  ].filter(Boolean).join(' ');
  return (
    <div ref={innerRef} className={`${base} rounded-2xl border border-slate-200 dark:border-slate-700 ${className}`}>{children}</div>
  );
};

/* ==================== 主程式 ==================== */
function App() {
  const [unlocked, setUnlocked] = useState(() => {
    try { return localStorage.getItem(GATE_KEY) === '1'; } catch (e) { return false; }
  });
  const [lang, setLang] = useState('en');
  const [isDark, setIsDark] = useState(true);
  const [section, setSection] = useState('ov');
  const [menuOpen, setMenuOpen] = useState(false);
  const [ttsState, setTtsState] = useState('idle');
  const [ttsWeek, setTtsWeek] = useState(null);   /* 語音正在唸的週次 */
  const [openWeek, setOpenWeek] = useState(null);
  const [blockFilter, setBlockFilter] = useState('all');
  const [mapsOpen, setMapsOpen] = useState(() => {
    try { return localStorage.getItem('pmcs_hub_maps') === '1'; } catch (e) { return false; }
  });
  const toggleMaps = (v) => { setMapsOpen(v); try { localStorage.setItem('pmcs_hub_maps', v ? '1' : '0'); } catch (e) {} };
  const ttsRun = useRef(0);
  const menuRef = useRef(null);
  const ttsUtter = useRef(null);      /* 保留參照，避免 utterance 被 GC 後 onend 永遠不觸發 */
  const ttsKeep = useRef(null);       /* Chrome 15 秒靜默的保活計時器 */
  const ttsWatch = useRef(null);      /* 看門狗：引擎卡住時把按鈕還原成播放 */

  const ttsClearTimers = () => {
    if (ttsKeep.current) { clearInterval(ttsKeep.current); ttsKeep.current = null; }
    if (ttsWatch.current) { clearInterval(ttsWatch.current); ttsWatch.current = null; }
  };
  /* 一定要先 resume 再 cancel：在 paused 狀態下 cancel，Chrome 的語音引擎會一直停在暫停，
     之後所有 speak() 都只會排進佇列卻永遠不發聲。 */
  const ttsHardReset = () => {
    try { speechSynthesis.resume(); } catch (e) {}
    try { speechSynthesis.cancel(); } catch (e) {}
    ttsClearTimers();
    ttsUtter.current = null;
  };
  useEffect(() => () => ttsClearTimers(), []);

  const t = TXT[lang];

  useEffect(() => {
    document.documentElement.classList.toggle('dark', isDark);
    document.documentElement.lang = lang === 'zh' ? 'zh-TW' : 'en';
  }, [isDark, lang]);

  useEffect(() => {
    const h = (e) => { if (menuRef.current && !menuRef.current.contains(e.target)) setMenuOpen(false); };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, []);

  useEffect(() => { ttsRun.current += 1; ttsHardReset(); setTtsState('idle'); setTtsWeek(null); }, [section, lang]);

  /* ===== 主題列：兩端箭頭、滾輪橫捲、朗讀時自動置中 ===== */
  const chipBoxRef = useRef(null);
  const chipRefs = useRef({});
  const weekRefs = useRef({});
  const [chipEdge, setChipEdge] = useState({ l: false, r: false });

  /* 左右還有沒有東西沒露出來 —— 決定兩端箭頭要不要出現 */
  const syncChipEdge = () => {
    const box = chipBoxRef.current;
    if (!box) return;
    const max = box.scrollWidth - box.clientWidth;
    const l = box.scrollLeft > 2, r = max > 2 && box.scrollLeft < max - 2;
    setChipEdge(prev => (prev.l === l && prev.r === r) ? prev : { l, r });
  };
  const nudgeChips = (dir) => {
    const box = chipBoxRef.current;
    if (!box) return;
    box.scrollTo({ left: box.scrollLeft + dir * Math.max(160, box.clientWidth * 0.8), behavior: 'smooth' });
  };
  useEffect(() => {
    if (section !== 'wk') return;
    syncChipEdge();
    const box = chipBoxRef.current;
    const onResize = () => syncChipEdge();
    /* 桌機沒有橫向捲動手勢，把垂直滾輪轉成橫捲；到底了就把捲動交還給頁面。
       必須用原生非被動監聽 —— React 的 onWheel 在根節點是 passive，preventDefault 無效。 */
    const onWheel = (e) => {
      if (!box) return;
      const max = box.scrollWidth - box.clientWidth;
      if (max <= 2) return;
      if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;
      const d = e.deltaY;
      if ((d < 0 && box.scrollLeft <= 0) || (d > 0 && box.scrollLeft >= max - 1)) return;
      e.preventDefault();
      box.scrollLeft += d;
    };
    if (box) box.addEventListener('wheel', onWheel, { passive: false });
    window.addEventListener('resize', onResize);
    return () => {
      if (box) box.removeEventListener('wheel', onWheel);
      window.removeEventListener('resize', onResize);
    };
  }, [section, lang, blockFilter]);
  const ttsBlock = ttsWeek ? ((WEEKS.find(w => w.n === ttsWeek) || {}).block || null) : null;
  useEffect(() => {
    if (section !== 'wk' || !ttsBlock) return;
    const box = chipBoxRef.current, el = chipRefs.current[ttsBlock];
    if (!box || !el) return;
    if (box.scrollWidth <= box.clientWidth + 2) return;   /* 全部看得到就不必捲 */
    const br = box.getBoundingClientRect(), er = el.getBoundingClientRect();
    const delta = (er.left + er.width / 2) - (br.left + br.width / 2);
    if (Math.abs(delta) > 2) box.scrollTo({ left: box.scrollLeft + delta, behavior: 'smooth' });
  }, [ttsBlock, section]);

  /* ===== 正在唸的那一週：垂直捲到頁首與主題列下方 ===== */
  useEffect(() => {
    if (section !== 'wk' || !ttsWeek) return;
    const card = weekRefs.current[ttsWeek];
    const box = chipBoxRef.current;
    if (!card) return;
    const HEADER = 64;                                   /* 固定頁首 h-16 */
    const strip = box ? box.getBoundingClientRect().height + 16 : 0;   /* sticky 主題列含內距 */
    const top = window.scrollY + card.getBoundingClientRect().top - HEADER - strip - 12;
    window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
  }, [ttsWeek, section]);

  /* ===== 朗讀途中改變篩選：停止朗讀，避免唸的和看的對不起來 ===== */
  const filterAtPlay = useRef(blockFilter);
  useEffect(() => {
    if (ttsState === 'idle') { filterAtPlay.current = blockFilter; return; }
    if (filterAtPlay.current !== blockFilter) {
      ttsRun.current += 1;
      ttsHardReset();
      setTtsState('idle'); setTtsWeek(null);
      filterAtPlay.current = blockFilter;
    }
  }, [blockFilter, ttsState]);

  /* ===== 日期計算 ===== */
  const cal = useMemo(() => {
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const list = WEEKS.map(w => ({ ...w, d: weekDate(w.n) }));
    const dday = weekDate(DDAY_WEEK);
    const ddayDiff = daysBetween(today, dday);
    let current = null, next = null;
    for (const w of list) {
      const diff = daysBetween(today, w.d);
      if (diff >= -6 && diff <= 0 && !current) current = w;
      if (diff > 0 && !next) next = w;
    }
    const started = daysBetween(today, list[0].d) <= 0;
    const ended = daysBetween(today, list[list.length - 1].d) < -6;
    return { today, list, dday, ddayDiff, current, next, started, ended };
  }, []);

  const goSection = (id) => { setSection(id); setMenuOpen(false); window.scrollTo({ top: 0, behavior: 'smooth' }); };

  const SECTIONS = [
    { id: 'ov',  label: t.s0, Icon: IconHome },
    { id: 'wk',  label: t.s1, Icon: IconCalendar },
    { id: 'sdl', label: t.s6, Icon: IconTool },
    { id: 'tp',  label: t.s2, Icon: IconTarget },
    { id: 'as',  label: t.s3, Icon: IconScale },
    { id: 'et',  label: t.s4, Icon: IconShield },
    { id: 'rs',  label: t.s5, Icon: IconLayers }
  ];

  /* ===== TTS ===== */
  const handleTTS = (action) => {
    if (!('speechSynthesis' in window)) return;
    if (action === 'stop') { ttsRun.current += 1; ttsHardReset(); setTtsState('idle'); setTtsWeek(null); return; }
    if (action === 'pause') {
      /* 引擎其實沒在講（已唸完或卡住）→ 不要送出 pause，直接還原成可播放 */
      if (!speechSynthesis.speaking && !speechSynthesis.pending) {
        ttsRun.current += 1; ttsHardReset(); setTtsState('idle'); setTtsWeek(null); return;
      }
      speechSynthesis.pause(); setTtsState('paused'); return;
    }
    if (action === 'play') {
      if (ttsState === 'paused' && (speechSynthesis.paused || speechSynthesis.speaking)) {
        speechSynthesis.resume(); setTtsState('playing'); return;
      }
      ttsRun.current += 1;
      ttsHardReset();
      const sep = lang === 'zh' ? '。 ' : '. ';
      /* items：每一段文字可帶一個 wk 標記，讓畫面知道正在唸哪一週 */
      let items = [];
      const put = (str, wk) => { if (str) items.push({ s: String(str), wk: wk == null ? null : wk }); };
      if (section === 'ov') {
        [t.course, t.ov_title, t.ov_what, t.ov_what_p].forEach(x => put(x));
        /* 安裝說明卡不在畫面上時就不唸，唸的和看的才會一致 */
        if (!isStandalone) {
          put(t.ov_pwa); put(t.ov_pwa_p);
          [[t.ov_pwa_pc, t.ov_pwa_pc_d], [t.ov_pwa_an, t.ov_pwa_an_d], [t.ov_pwa_ios, t.ov_pwa_ios_d]]
            .forEach(([a, b2]) => put(`${a}. ${b2}`));
        }
      } else if (section === 'wk') {
        /* 未篩選才唸整節抬頭；篩選了就從那個區塊本身開始唸 */
        if (blockFilter === 'all') {
          put(t.wk_title); put(t.wk_sub);
          /* 說明卡收起來時就不唸，唸的和看的才會一致 */
          if (mapsOpen) {
            put(t.wk_maps);
            MAPS.forEach(m => put(`${lang === 'zh' ? m.no_zh : m.no_en}. ${m[lang]}. ${lang === 'zh' ? m.d_zh : m.d_en}`));
          }
        }
        else if (BLOCKS[blockFilter]) { put(BLOCKS[blockFilter][lang]); }
        (blockFilter === 'all' ? WEEKS : WEEKS.filter(w => w.block === blockFilter))
          .forEach(w => put(`W${w.n}. ${w[lang].t}. ${w[lang].s}`, w.n));
      } else if (section === 'tp') {
        [t.tp_title, t.tp_intro, t.tp_spec].forEach(x => put(x));
        TP_SPEC.forEach((x, i) => put(`${i + 1}. ${x[lang]}. ${lang === 'zh' ? x.d_zh : x.d_en}`));
        put(t.tp_ladder); put(t.tp_ladder_note);
        LADDER.forEach(l => put(`Level ${l.lv}. ${l[lang]}. ${lang === 'zh' ? l.zh_d : l.en_d}`));
        put(t.tp_dday); put(t.tp_dday_note);
      } else if (section === 'as') {
        put(t.as_title); put(t.as_weights);
        GRADE.forEach(g => put(`${g[lang]} ${g.pct}%`));
        put(t.as_ws); put(t.as_ws_p1); put(t.as_ws_1); put(t.as_ws_2); put(t.as_ws_3); put(t.as_ws_warn);
        put(t.as_tx); put(t.as_tx_p);
        [t.as_tx_1, t.as_tx_2, t.as_tx_3, t.as_tx_4].forEach((x, i) => put(`${i + 1}. ${x}`));
        put(t.as_tx_no);
        put(t.as_dl); put(t.as_dl_p);
        put(t.as_w16);
        W16_CHECK.forEach(c => put(`${c[lang]}. ${lang === 'zh' ? c.e_zh : c.e_en}`));
      } else if (section === 'et') {
        put(t.et_title); put(t.et_intro);
        ETHICS.forEach((e, i) => put(`${i + 1}. ${e[lang]}`));
        put(t.et_gate);
        [[t.et_g1, t.et_g1d], [t.et_g2, t.et_g2d], [t.et_g3, t.et_g3d], [t.et_g4, t.et_g4d]].forEach(([a, b2]) => put(`${a}. ${b2}`));
      } else if (section === 'sdl') {
        put(t.sd_title); put(t.sd_intro);
        SDL_STEPS.forEach((x, i) => put(`${i + 1}. ${x[lang]}. ${lang === 'zh' ? x.d_zh : x.d_en}`));
        put(t.sd_plat);
        SDL_ROUTES.forEach(r => {
          put(`${r[lang]}. ${lang === 'zh' ? r.d_zh : r.d_en}`);
          r.rows.forEach(x => put(`${x.name}. ${lang === 'zh' ? x.d_zh : x.d_en}`));
        });
        put(t.sd_plat_note);
        put(t.sd_rule); put(t.sd_rule_p);
      } else {
        put(t.rs_title); put(t.rs_teach);
        TEACH.forEach(x => put(`${x.code}. ${x[lang]}`));
      }
      /* 語音挑選：與課程既有 SPA 完全一致，不做任何更動 */
      const voices = speechSynthesis.getVoices();
      let voice = null, code = 'en-GB';
      if (lang === 'zh') {
        voice = voices.find(v => v.lang === 'zh-TW' && v.name.includes('Yating')) || voices.find(v => v.lang === 'zh-TW') || voices.find(v => v.lang.startsWith('zh')) || null;
        code = 'zh-TW';
      } else {
        voice = voices.find(v => v.lang === 'en-GB' && (v.name.includes('Male') || v.name.includes('Daniel'))) || voices.find(v => v.lang === 'en-GB') || voices.find(v => v.lang.startsWith('en')) || null;
        code = 'en-GB';
      }

      /* Chrome 對單一長 utterance 會靜默失敗（網路語音尤其明顯），因此切成短句依序播放。
         切法改為「逐段各自切」，這樣每一小段都還知道自己屬於哪一週。 */
      const CHUNK = lang === 'zh' ? 140 : 190;
      const packOne = (full) => {
        const sentences = (() => {
          const out = []; let cur = '';
          for (let i = 0; i < full.length; i++) {
            cur += full[i];
            const c = full[i];
            if ('。！？；!?;'.indexOf(c) >= 0 || (c === '.' && /\s|$/.test(full[i + 1] || ''))) { out.push(cur); cur = ''; }
          }
          if (cur.trim()) out.push(cur);
          return out;
        })();
        const packed = []; let acc = '';
        sentences.forEach(sent0 => {
          let sent = sent0;
          while (sent.length > CHUNK) {
            let cut = sent.lastIndexOf(' ', CHUNK);
            if (cut < CHUNK * 0.5) cut = CHUNK;
            if (acc) { packed.push(acc); acc = ''; }
            packed.push(sent.slice(0, cut));
            sent = sent.slice(cut);
          }
          if ((acc + sent).length > CHUNK) { if (acc) packed.push(acc); acc = sent; }
          else acc += sent;
        });
        if (acc.trim()) packed.push(acc);
        return packed;
      };
      const queue = [];
      items.forEach(it => {
        /* 本身已有句末標點就不再補一個，避免唸出「⋯⋯..」 */
        const tail = /[.。！？；!?;]\s*$/.test(it.s) ? ' ' : sep;
        packOne(it.s + tail).forEach(c => queue.push({ c, wk: it.wk }));
      });

      ttsRun.current += 1;
      const myRun = ttsRun.current;
      let qi = 0;
      let idleTicks = 0, everStarted = false;
      const finish = () => { ttsClearTimers(); ttsUtter.current = null; setTtsState('idle'); setTtsWeek(null); };
      const speakNext = () => {
        if (myRun !== ttsRun.current) return;
        if (qi >= queue.length) { finish(); return; }
        const item = queue[qi++];
        setTtsWeek(item.wk);
        const u = new SpeechSynthesisUtterance(item.c);
        u.rate = 0.95;
        if (voice) u.voice = voice;
        u.lang = code;
        u.onstart = () => { everStarted = true; idleTicks = 0; };
        u.onend = speakNext;
        u.onerror = () => { if (myRun === ttsRun.current) speakNext(); };
        ttsUtter.current = u;          /* 保留參照，避免被 GC */
        try { speechSynthesis.resume(); } catch (e) {}
        speechSynthesis.speak(u);
      };
      setTtsState('playing');

      /* Chrome 約 15 秒後會靜默停住且不觸發 onend，週期性 pause/resume 可維持運作 */
      ttsClearTimers();
      ttsKeep.current = setInterval(() => {
        if (myRun !== ttsRun.current) return;
        if (!speechSynthesis.speaking || speechSynthesis.paused) return;   /* 使用者按了暫停就別動它 */
        try { speechSynthesis.pause(); speechSynthesis.resume(); } catch (e) {}
      }, 8000);

      /* 看門狗：連續三次（約 2.4 秒）引擎既沒在講也沒在等，就視為已結束或卡住，把按鈕還原。
         門檻拉到 2.4 秒是為了容忍網路語音的起始延遲；utterance 一旦真的開始講就會歸零。 */
      ttsWatch.current = setInterval(() => {
        if (myRun !== ttsRun.current) { ttsClearTimers(); return; }
        if (speechSynthesis.speaking || speechSynthesis.pending || speechSynthesis.paused) { idleTicks = 0; return; }
        idleTicks += 1;
        /* 只有在確定引擎會回報 onstart 時才用 2.4 秒的快速判定；
           若這個瀏覽器從沒回報過 onstart，就退回 24 秒的保守停滯判定，免得誤砍正常朗讀。 */
        if (idleTicks >= (everStarted ? 3 : 30)) { ttsRun.current += 1; finish(); }
      }, 800);

      setTimeout(speakNext, 60);
    }
  };

  if (!unlocked) {
    return <Gate onPass={() => setUnlocked(true)} lang={lang} setLang={setLang} isDark={isDark} />;
  }

  /* ==================== 0 · 總覽 ==================== */
  const renderOverview = () => {
    const { current, next, dday, ddayDiff, started, ended } = cal;
    const milestones = [
      { k: 'proposal', wk: 9,  label: t.ov_m_proposal },

      { k: 'dday',     wk: 15, label: t.ov_m_dday },
      { k: 'pitch',    wk: 16, label: t.ov_m_pitch }
    ].map(m => {
      const d = weekDate(m.wk);
      const diff = daysBetween(cal.today, d);
      return { ...m, d, diff, done: diff < 0 };
    });

    const statusLabel = ended ? t.ov_after : (current ? `${t.ov_now} · W${current.n}` : (started ? t.ov_next : t.ov_before));
    const statusWeek = current || next || cal.list[0];
    const statusDiff = statusWeek ? daysBetween(cal.today, statusWeek.d) : null;

    return (
      <div className="space-y-8 animate-fade-in">
        <div>
          <p className="text-[11px] font-bold uppercase tracking-[0.2em] text-slate-400 mb-2">{t.dept}</p>
          <h1 className="font-serif font-black text-2xl sm:text-4xl leading-tight text-[#004030] dark:text-[#D8C3A5]">{t.course}</h1>
          <p className="mt-2 text-sm text-slate-500 dark:text-slate-400">{t.teacher}</p>
        </div>

        {/* 儀表板三格 */}
        <div className="grid gap-4 sm:grid-cols-3">
          <Card className="p-5">
            <p className="text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-2">{statusLabel}</p>
            <p className="font-serif font-black text-xl text-[#004030] dark:text-[#D8C3A5] leading-snug">
              {statusWeek ? `W${statusWeek.n} · ${statusWeek[lang].t}` : '—'}
            </p>
            {statusWeek && (
              <p className="mt-2 text-[13px] text-slate-500 dark:text-slate-400">
                {fmtFull(statusWeek.d)}
                {statusDiff > 0 && <span> · {statusDiff} {t.ov_days}</span>}
                {statusDiff === 0 && <span> · {t.ov_today}</span>}
              </p>
            )}
          </Card>

          <Card className="p-5 sm:col-span-2 bg-[#004030] dark:bg-[#004030] border-[#004030]">
            <div className="flex items-start justify-between gap-4">
              <div className="min-w-0">
                <p className="text-[11px] font-bold uppercase tracking-wider text-[#D8C3A5]/70 mb-2">{t.ov_dday} · W{DDAY_WEEK}</p>
                <p className="font-serif font-black text-2xl text-[#D8C3A5]">{fmtFull(dday)}</p>
                <p className="mt-1 text-[13px] text-white/60">{t.ov_dday_sub}</p>
              </div>
              <div className="text-right shrink-0">
                <p className="font-serif font-black text-4xl sm:text-5xl text-white leading-none tabular-nums">
                  {ddayDiff > 0 ? ddayDiff : (ddayDiff === 0 ? '0' : Math.abs(ddayDiff))}
                </p>
                <p className="text-[11px] uppercase tracking-wider text-[#D8C3A5]/70 mt-1">
                  {ddayDiff > 0 ? t.ov_days : (ddayDiff === 0 ? t.ov_today : `${t.ov_days} · ${t.ov_passed}`)}
                </p>
              </div>
            </div>
          </Card>
        </div>

        {/* 里程碑 */}
        <section>
          <h3 className="font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5] mb-3">{t.ov_mile}</h3>
          <div className="grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
            {milestones.map(m => (
              <Card key={m.k} className={`p-4 ${m.done ? 'opacity-55' : ''}`}>
                <div className="flex items-center gap-2 mb-1">
                  <span className={`w-2 h-2 rounded-full shrink-0 ${m.done ? 'bg-slate-400' : 'bg-[#004030] dark:bg-[#D8C3A5]'}`}></span>
                  <p className="text-[13px] font-bold text-slate-700 dark:text-slate-200 truncate">{m.label}</p>
                </div>
                <p className="text-[12px] text-slate-500 dark:text-slate-400 pl-4">
                  {fmtFull(m.d)}
                  {m.diff > 0 && <span> · {m.diff} {t.ov_days}</span>}
                  {m.diff === 0 && <span> · {t.ov_today}</span>}
                </p>
              </Card>
            ))}
          </div>
        </section>

        {/* 課程地圖 */}
        <section>
          <h3 className="font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5] mb-3">{t.ov_map}</h3>
          <div className="space-y-2">
            {['intro', 'arch', 'role', 'tp', 'build', 'pjm', 'flex'].map(bk => {
              const ws = WEEKS.filter(w => w.block === bk);
              const nums = ws.map(w => w.n);
              const contiguous = nums.every((v, i) => i === 0 || v === nums[i - 1] + 1);
              const rangeLabel = contiguous
                ? `W${nums[0]}${nums.length > 1 ? `–W${nums[nums.length - 1]}` : ''}`
                : nums.map(v => `W${v}`).join(' · ');
              return (
                <button key={bk} onClick={() => { setBlockFilter(bk); goSection('wk'); }}
                  className="w-full text-left flex flex-wrap items-center gap-x-4 gap-y-1 px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700
                    bg-white dark:bg-slate-800/60 hover:border-[#004030] dark:hover:border-[#D8C3A5] transition-colors">
                  <span className="font-mono text-[12px] font-bold text-slate-400 shrink-0 w-20">{rangeLabel}</span>
                  <span className="flex-1 min-w-0 text-[13px] sm:text-sm font-bold text-slate-700 dark:text-slate-200">{BLOCKS[bk][lang]}</span>
                  <span className="text-slate-400 shrink-0"><IconChevronDown size={16} /></span>
                </button>
              );
            })}
          </div>
        </section>

        {/* 這學期會做出什麼 */}
        <Card className="p-6 border-l-4 border-l-[#004030] dark:border-l-[#D8C3A5]">
          <h3 className="font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5] mb-2">{t.ov_what}</h3>
          <p className="text-[14px] leading-relaxed text-slate-600 dark:text-slate-300">{t.ov_what_p}</p>

        {/* 裝成 App（PWA）—— 已在 App 中開啟時就不再囉嗦 */}
        {!isStandalone && (

              <IconInstall size={18} />{t.ov_pwa}
            </h3>
            <p className="text-[13px] leading-relaxed text-slate-600 dark:text-slate-300 max-w-3xl">{t.ov_pwa_p}</p>
            <div className="mt-4 grid gap-3 sm:grid-cols-3">
              {[[t.ov_pwa_pc, t.ov_pwa_pc_d], [t.ov_pwa_an, t.ov_pwa_an_d], [t.ov_pwa_ios, t.ov_pwa_ios_d]].map(([a, b2], i) => (
                <div key={i} className="p-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/60">
                  <p className="text-[13px] font-bold text-slate-700 dark:text-slate-200">{a}</p>
                  <p className="mt-1 text-[12px] leading-relaxed text-slate-500 dark:text-slate-400">{b2}</p>
                </div>
              ))}
            </div>
          </Card>
        )}

        {/* 快速前往 */}
        <section>
          <h3 className="font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5] mb-3">{t.ov_quick}</h3>
          <div className="grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
            {[
              { u: WS_BASE, a: t.ov_quick_ws, b: t.ov_quick_ws_d },
              { u: null, s: 'rs', a: t.ov_quick_teach, b: t.ov_quick_teach_d },
              { u: 'https://lolopodcast.github.io/daily-brief/', a: t.ov_quick_bench, b: t.ov_quick_bench_d },
              { u: HUB, a: t.ov_quick_hub, b: t.ov_quick_hub_d }

                className="group p-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800/60
                  hover:border-[#004030] dark:hover:border-[#D8C3A5] transition-colors">
                <p className="flex items-center gap-1.5 text-sm font-bold text-[#004030] dark:text-[#D8C3A5]">{q.a}<IconExternal /></p>
                <p className="mt-1 text-[12px] text-slate-500 dark:text-slate-400">{q.b}</p>
              </a>
            ) : (
              <button key={i} onClick={() => goSection(q.s)}
                className="group text-left p-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800/60
                  hover:border-[#004030] dark:hover:border-[#D8C3A5] transition-colors">
                <p className="text-sm font-bold text-[#004030] dark:text-[#D8C3A5]">{q.a}</p>
                <p className="mt-1 text-[12px] text-slate-500 dark:text-slate-400">{q.b}</p>
              </button>
            ))}
          </div>
        </section>
      </div>
    );
  };

  /* ==================== 1 · 每週教材 ==================== */
  const renderWeekly = () => {
    const shown = blockFilter === 'all' ? WEEKS : WEEKS.filter(w => w.block === blockFilter);
    return (
      <div className="space-y-6 animate-fade-in">
        <div>
          <H2>{t.wk_title}</H2>
          <p className="text-[14px] text-slate-500 dark:text-slate-400">{t.wk_sub}</p>
        </div>

        {/* 三張圖說明：後面每一週都會引用「圖一／圖二／圖三」，先在這裡定義。
            預設收合 —— 手機上不該一進來就被它佔滿整個畫面。 */}
        <details open={mapsOpen} onToggle={(e) => toggleMaps(e.currentTarget.open)}
          className="bg-white dark:bg-slate-800/60 rounded-2xl border border-slate-200 dark:border-slate-700
            border-l-4 border-l-[#004030] dark:border-l-[#D8C3A5] overflow-hidden">
          <summary className="list-none cursor-pointer px-5 py-4 flex items-start gap-3
            hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
            <span className="flex-1 min-w-0">
              <span className="block font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5]">{t.wk_maps}</span>
              {!mapsOpen && <span className="block mt-1 text-[12px] text-slate-500 dark:text-slate-400">{t.wk_maps_peek}</span>}
            </span>
            <span className={`shrink-0 mt-1 text-slate-400 transition-transform ${mapsOpen ? 'rotate-180' : ''}`}>
              <IconChevronDown />
            </span>
          </summary>
          <div className="px-5 pb-5">
            <p className="text-[13px] leading-relaxed text-slate-600 dark:text-slate-300">{t.wk_maps_note}</p>
            <div className="mt-4 space-y-3">
              {MAPS.map(m => (
                <div key={m.code} className="flex flex-col sm:flex-row sm:items-start gap-2 sm:gap-4
                  pt-3 border-t border-slate-100 dark:border-slate-700">
                  <div className="shrink-0 sm:w-28">
                    <p className="font-serif font-black text-base text-[#004030] dark:text-[#D8C3A5]">{lang === 'zh' ? m.no_zh : m.no_en}</p>
                    <p className="font-mono text-[11px] font-bold text-slate-400">{m.code}</p>
                  </div>
                  <div className="min-w-0 flex-1">
                    <a href={m.url} target="_blank" rel="noopener noreferrer"
                      className="group inline-flex items-start gap-1.5 text-[14px] font-bold text-slate-800 dark:text-slate-100
                        hover:text-[#004030] dark:hover:text-[#D8C3A5]">
                      {m[lang]}<span className="shrink-0 mt-1 text-slate-400 group-hover:text-[#004030] dark:group-hover:text-[#D8C3A5]"><IconExternal /></span>
                    </a>
                    <p className="mt-1 text-[13px] leading-relaxed text-slate-600 dark:text-slate-300">{lang === 'zh' ? m.d_zh : m.d_en}</p>
                    <p className="mt-1.5 text-[11px] font-bold text-slate-400">{t.wk_maps_wk} {m.wk}</p>
                  </div>
                </div>
              ))}
            </div>
          </div>

        <div className="mt-4 pt-3 border-t border-[#D8C3A5]/30 flex items-start gap-2">
          <span className="shrink-0 mt-0.5 text-amber-300"><IconAlert size={16} /></span>
          <p className="text-[13px] leading-relaxed text-amber-100">{t.as_ws_warn}</p>
        </div>
        <p className="mt-3 text-[12px] leading-relaxed text-white/55">{t.as_ws_note}</p>
      </Card>

      <Card className="p-5 border-l-4 border-l-[#004030] dark:border-l-[#D8C3A5]">
        <h3 className="font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5] mb-2">{t.as_tx}</h3>
        <p className="text-[13px] leading-relaxed text-slate-600 dark:text-slate-300 max-w-3xl">{t.as_tx_p}</p>
        <ol className="mt-4 space-y-2.5">
          {[t.as_tx_1, t.as_tx_2, t.as_tx_3, t.as_tx_4].map((x, i) => (
            <li key={i} className="flex gap-3 text-[13px] leading-relaxed text-slate-700 dark:text-slate-200">
              <span className="shrink-0 w-5 h-5 rounded-md bg-[#004030] dark:bg-[#D8C3A5] text-[#D8C3A5] dark:text-[#004030]
                text-[11px] font-bold flex items-center justify-center">{i + 1}</span>
              <span>{x}</span>
            </li>
          ))}
        </ol>
        <div className="mt-4 pt-3 border-t border-slate-200 dark:border-slate-700 flex items-start gap-2">
          <span className="shrink-0 mt-0.5 text-amber-600 dark:text-amber-400"><IconAlert size={16} /></span>
          <p className="text-[13px] leading-relaxed text-slate-600 dark:text-slate-300">{t.as_tx_no}</p>
        </div>
      </Card>

      <Card className="p-5 border-l-4 border-l-[#004030] dark:border-l-[#D8C3A5]">
        <h3 className="font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5] mb-2">{t.as_dl}</h3>
        <p className="text-[13px] leading-relaxed text-slate-600 dark:text-slate-300 max-w-3xl">{t.as_dl_p}</p>
      </Card>

      <section>
        <h3 className="font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5] mb-3">{t.as_w16}</h3>
        <div className="overflow-x-auto -mx-4 sm:mx-0 px-4 sm:px-0">
          <table className="w-full min-w-[520px] text-[13px] border-collapse">
            <thead>
              <tr className="text-left text-[11px] uppercase tracking-wider text-slate-400 border-b border-slate-200 dark:border-slate-700">
                <th className="py-2 pr-3 font-bold whitespace-nowrap">{t.as_w16_c1}</th>
                <th className="py-2 pl-3 font-bold">{t.as_w16_c2}</th>
              </tr>
            </thead>
            <tbody>
              {W16_CHECK.map((c, i) => (
                <tr key={i} className="border-b border-slate-100 dark:border-slate-800">
                  <td className="py-3 pr-3 font-bold text-slate-800 dark:text-slate-100 align-top">{c[lang]}</td>
                  <td className="py-3 pl-3 text-slate-600 dark:text-slate-300">{lang === 'zh' ? c.e_zh : c.e_en}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </section>

      <Card className="p-5 border-l-4 border-l-[#004030] dark:border-l-[#D8C3A5]">
        <p className="text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">{t.as_note}</p>
        <p className="text-[13px] leading-relaxed text-slate-600 dark:text-slate-300">{t.as_note_p}</p>
      </Card>
    </div>
  );

  /* ==================== 4 · 倫理聲明 ==================== */
  const renderEthics = () => (
    <div className="space-y-8 animate-fade-in">
      <div>
        <H2>{t.et_title}</H2>
        <p className="text-[14px] leading-relaxed text-slate-600 dark:text-slate-300 max-w-3xl">{t.et_intro}</p>
      </div>

      <ol className="space-y-2">
        {ETHICS.map((e, i) => (
          <Card key={i} className="p-4 flex gap-4">
            <span className="shrink-0 font-serif font-black text-lg text-slate-300 dark:text-slate-600 tabular-nums w-6">{i + 1}</span>
            <p className="text-[13px] leading-relaxed text-slate-700 dark:text-slate-200">{e[lang]}</p>
          </Card>
        ))}
      </ol>

      <section>
        <h3 className="font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5] mb-3">{t.et_gate}</h3>
        <div className="grid gap-3 sm:grid-cols-2">
          {[[t.et_g1, t.et_g1d], [t.et_g2, t.et_g2d], [t.et_g3, t.et_g3d], [t.et_g4, t.et_g4d]].map(([a, b], i) => (
            <Card key={i} className="p-4">
              <p className="flex items-center gap-2 font-bold text-[14px] text-[#004030] dark:text-[#D8C3A5]">
                <span className="shrink-0"><IconShield size={16} /></span>{a}
              </p>
              <p className="mt-1.5 text-[13px] leading-relaxed text-slate-600 dark:text-slate-300">{b}</p>
            </Card>
          ))}
        </div>
      </section>
    </div>
  );

  /* ==================== 5 · 資源總表 ==================== */
  const renderResources = () => (
    <div className="space-y-8 animate-fade-in">
      <H2>{t.rs_title}</H2>

      <section>
        <h3 className="font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5] mb-3">{t.rs_teach}</h3>
        <div className="grid gap-3 md:grid-cols-2">
          {TEACH.map(x => (
            <a key={x.code} href={x.url} target="_blank" rel="noopener noreferrer"
              className="group p-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800/60
                hover:border-[#004030] dark:hover:border-[#D8C3A5] transition-colors">
              <div className="flex items-center justify-between gap-2">
                <p className="font-mono text-[12px] font-bold text-[#004030] dark:text-[#D8C3A5]">{x.code}</p>
                <span className="text-[11px] font-bold text-slate-400">{x.wk}</span>
              </div>
              <p className="mt-1.5 flex items-start gap-1.5 text-[13px] font-bold text-slate-800 dark:text-slate-100 leading-snug">
                {x[lang]}<span className="shrink-0 mt-1 text-slate-400 group-hover:text-[#004030] dark:group-hover:text-[#D8C3A5]"><IconExternal /></span>
              </p>
            </a>
          ))}
        </div>
      </section>

      <section>
        <h3 className="font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5] mb-1">{t.rs_ws}</h3>
        <p className="text-[13px] text-slate-500 dark:text-slate-400 mb-3">{t.rs_ws_note}</p>
        <div className="flex flex-wrap gap-2">
          <a href={WS_BASE} target="_blank" rel="noopener noreferrer"
            className="inline-flex items-center gap-1.5 px-4 py-2 rounded-lg bg-[#004030] text-[#D8C3A5] dark:bg-[#D8C3A5] dark:text-[#004030] text-[12px] font-bold hover:opacity-90">
            {t.rs_index}<IconExternal />
          </a>
          {WEEKS.filter(w => w.ws).map(w => (
            <a key={w.n} href={`${WS_BASE}${w.ws.c}/`} target="_blank" rel="noopener noreferrer"
              className="inline-flex items-center gap-1 px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700
                bg-white dark:bg-slate-800 text-[12px] font-bold text-slate-600 dark:text-slate-300
                hover:border-[#004030] dark:hover:border-[#D8C3A5] hover:text-[#004030] dark:hover:text-[#D8C3A5]">
              {w.ws.c}<IconExternal size={12} />
            </a>
          ))}
        </div>
      </section>

      <section>
        <h3 className="font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5] mb-3">{t.rs_hub}</h3>
        <div className="space-y-2">
          {[
            { a: t.rs_hub_1, u: HUB },
            { a: t.rs_hub_2, u: 'https://lolopodcast.github.io/daily-brief/' },
            { a: t.rs_hub_3, u: 'https://lolopodcast.github.io/SPA-Gallery/' },
            { a: t.rs_hub_4, u: 'https://ncnulolotas.github.io/1142SMMC-EMI-TPs/' }
          ].map((x, i) => (
            <a key={i} href={x.u} target="_blank" rel="noopener noreferrer"
              className="group flex items-center gap-2 px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700
                bg-white dark:bg-slate-800/60 hover:border-[#004030] dark:hover:border-[#D8C3A5] transition-colors">
              <span className="flex-1 min-w-0 text-[13px] font-bold text-slate-700 dark:text-slate-200
                group-hover:text-[#004030] dark:group-hover:text-[#D8C3A5]">{x.a}</span>
              <span className="shrink-0 text-slate-400 group-hover:text-[#004030] dark:group-hover:text-[#D8C3A5]"><IconExternal /></span>
            </a>
          ))}
        </div>
      </section>
    </div>
  );

  const renderBody = () => {
    if (section === 'ov') return renderOverview();
    if (section === 'wk') return renderWeekly();
    if (section === 'sdl') return renderSDL();
    if (section === 'tp') return renderTP();
    if (section === 'as') return renderAssessment();
    if (section === 'et') return renderEthics();
    return renderResources();
  };

  return (
    <div className="min-h-screen flex flex-col pt-16 overflow-x-clip">
      {/* HEADER */}
      <header className="fixed top-0 left-0 right-0 h-16 bg-[#004030] dark:bg-slate-900 text-white z-50 shadow-lg border-b border-[#D8C3A5]/30">
        <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
          <div className="flex items-center gap-2 min-w-0">
            <div className="relative" ref={menuRef}>
              <button onClick={() => setMenuOpen(!menuOpen)} aria-label={t.nav_modules} aria-expanded={menuOpen}
                className="p-2 hover:bg-white/10 rounded-lg">{menuOpen ? <IconX /> : <IconMenu />}</button>
              {menuOpen && (
                <div className="absolute top-full left-0 mt-1 w-64 max-w-[calc(100vw-2rem)] max-h-[calc(100vh-5rem)] overflow-y-auto
                  bg-white dark:bg-slate-800 rounded-xl shadow-2xl border border-slate-200 dark:border-slate-700 z-[100] py-2">
                  {SECTIONS.map(s => (
                    <button key={s.id} onClick={() => goSection(s.id)}
                      className={`w-full flex items-center gap-3 px-4 py-3 text-sm text-left transition-all
                        ${section === s.id ? 'bg-[#004030]/10 dark:bg-[#D8C3A5]/15 text-[#004030] dark:text-[#D8C3A5] font-bold'
                          : 'text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700'}`}>
                      <span className="shrink-0"><s.Icon size={16} /></span>
                      <span className="truncate">{s.label}</span>
                    </button>
                  ))}
                </div>
              )}
            </div>
            <button onClick={() => { setSection('ov'); window.scrollTo({ top: 0, behavior: 'smooth' }); }}
              aria-label={t.nav_home} className="p-2 hover:bg-white/10 rounded-lg"><IconHome size={18} /></button>
            <button onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })} className="flex items-center gap-2 min-w-0">
              <span className="font-serif font-black text-[#D8C3A5] text-lg tracking-widest shrink-0">{t.brand}</span>
              <span className="hidden sm:inline font-serif font-bold text-sm md:text-base truncate">{t.title}</span>
            </button>
          </div>
          <div className="flex items-center gap-1 sm:gap-2 shrink-0">
            <button onClick={() => handleTTS(ttsState === 'playing' ? 'pause' : 'play')} aria-label={t.audio_read}
              className="p-2 hover:bg-white/10 rounded-lg">{ttsState === 'playing' ? <IconPause /> : <IconPlay />}</button>
            <button onClick={() => handleTTS('stop')} aria-label="Stop" className="p-2 hover:bg-white/10 rounded-lg"><IconSquare /></button>
            <button onClick={() => setLang(lang === 'en' ? 'zh' : 'en')}
              className="px-2 sm:px-3 py-1.5 text-xs font-bold border border-[#D8C3A5]/50 rounded-lg hover:bg-white/10">
              {lang === 'en' ? '中文' : 'EN'}
            </button>
            <button onClick={() => setIsDark(!isDark)} aria-label="Theme" className="p-2 hover:bg-white/10 rounded-lg">
              {isDark ? <IconSun /> : <IconMoon />}
            </button>
          </div>
        </div>
      </header>

      {/* BODY */}
      <div className="flex-1 w-full max-w-7xl mx-auto flex">
        <aside className="hidden md:block w-56 shrink-0 border-r border-slate-200 dark:border-slate-700 py-8 px-3">
          <div className="sticky top-24 space-y-1">
            <p className="text-[11px] font-bold uppercase tracking-wider text-slate-400 px-3 mb-2">{t.nav_modules}</p>
            {SECTIONS.map(s => (
              <button key={s.id} onClick={() => goSection(s.id)}
                className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm text-left transition-all
                  ${section === s.id ? 'bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold'
                    : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'}`}>
                <span className="shrink-0"><s.Icon size={16} /></span>
                <span className="truncate text-[13px]">{s.label}</span>
              </button>
            ))}
          </div>
        </aside>
        <main className="flex-1 min-w-0 px-4 sm:px-6 lg:px-8 py-8">{renderBody()}</main>
      </div>

      {/* FOOTER */}
      <footer className="h-8 bg-[#004030] flex items-center justify-between gap-2 px-3 sm:px-4 shrink-0">
        <span className="text-[#D8C3A5]/60 text-[10px] sm:text-xs truncate min-w-0">
          <span className="hidden sm:inline">{t.date} · {t.copyright}</span>
          <span className="sm:hidden">{t.date}</span>
        </span>
        <span className="text-[#D8C3A5]/60 text-[10px] sm:text-xs flex items-center gap-2 sm:gap-3 shrink-0">
          <span className="whitespace-nowrap">
            <span className="hidden sm:inline">{t.architect_label}&nbsp;</span>
            <a href={t.architect_url} target="_blank" rel="noopener noreferrer" className="text-[#D8C3A5] hover:text-white underline">Prof. Shihmin Lo</a>
          </span>
          <button onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })} className="text-[#D8C3A5] hover:text-white font-bold whitespace-nowrap">Top ↑</button>
        </span>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
